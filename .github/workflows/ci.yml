name: Recovery quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "recovery/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: recovery_test
          MYSQL_USER: recovery
          MYSQL_PASSWORD: recovery_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -urecovery -precovery_test --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: "true"
      DATABASE_URL: mysql://recovery:recovery_test@127.0.0.1:3306/recovery_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Scan the release tree for secrets
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --no-banner --redact --report-format json --report-path /repo/gitleaks-report.json
          status=$?
          if test -s gitleaks-report.json; then
            jq -r '.[] | "gitleaks: \(.RuleID) \(.File):\(.StartLine)"' gitleaks-report.json
          fi
          rm -f gitleaks-report.json
          exit "$status"
      - run: pnpm check
      - name: Apply canonical migrations
        run: pnpm exec drizzle-kit migrate
      - name: Verify consolidated schema parity
        run: pnpm db:verify-parity
      - run: pnpm test
      - run: pnpm build
      - name: Build the production container
        run: docker build --tag va-dashboard:ci .
      - name: Build the migration container
        run: docker build --target migration --tag va-dashboard:migration-ci .
      - name: Validate Hetzner Compose configuration
        run: APP_ENV_FILE=.env.app.example docker compose --env-file deployment/.env.hetzner.example -f deployment/compose.hetzner.yml config --quiet
      - name: Verify migration metadata matches the schema
        shell: bash
        run: |
          pnpm exec drizzle-kit generate --name ci-drift
          test -z "$(git status --porcelain -- drizzle)"
