name: Recovery quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "recovery/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: recovery_test
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U recovery -d recovery_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: "true"
      DATABASE_URL: postgresql://recovery:recovery_test@127.0.0.1:5432/recovery_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit locked dependencies
        run: pnpm audit --audit-level=low
      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            if [[ "$name" == ".env" || ( "$name" == .env.* && "$name" != ".env.example" ) ]]; then
              echo "Refusing to keep environment file in Git: $file" >&2
              exit 1
            fi
          done < <(git ls-files -z)
      - name: Scan the release tree for secrets
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --no-banner --redact --report-format json --report-path /repo/gitleaks-report.json
          status=$?
          if test -s gitleaks-report.json; then
            jq -r '.[] | "gitleaks: \(.RuleID) \(.File):\(.StartLine)"' gitleaks-report.json
          fi
          rm -f gitleaks-report.json
          exit "$status"
      - run: pnpm check
      - run: pnpm check:db-transfer
      - name: Test deployment release-source validation
        run: node --test deployment/hetzner/release-source.test.mjs
      - name: Validate production URL and webhook Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          export PUBLIC_URL=https://dashboard.example.com
          export APP_URL=https://dashboard.example.com
          export VITE_FRONTEND_URL=https://dashboard.example.com
          export TRELLO_WEBHOOK_CALLBACK_URL=https://dashboard.example.com/api/trello-webhook
          docker compose --env-file .env config --format json | node --input-type=module -e '
            import assert from "node:assert/strict";
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const app = JSON.parse(input).services.app;
            assert.equal(app.environment.PUBLIC_URL, "https://dashboard.example.com");
            assert.equal(app.environment.TRELLO_WEBHOOK_CALLBACK_URL, "https://dashboard.example.com/api/trello-webhook");
            assert.equal(app.environment.APP_URL, "https://dashboard.example.com");
            assert.equal(app.environment.VITE_FRONTEND_URL, "https://dashboard.example.com");
          '
      - name: Apply PostgreSQL migrations
        run: pnpm exec drizzle-kit migrate
      - name: Verify PostgreSQL schema parity
        run: pnpm db:verify-parity
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for browser smoke tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify authentication and worker dashboard in a browser
        env:
          JWT_SECRET: ci-only-playwright-session-secret-not-for-deployment
        run: pnpm exec playwright test --project=chromium
      - name: Verify PostgreSQL backup and isolated restore
        shell: bash
        env:
          RESTORE_DATABASE_URL: postgresql://recovery:recovery_test@127.0.0.1:5432/recovery_restore_verify?sslmode=disable
        run: |
          set -euo pipefail
          cleanup() {
            docker run --rm --network host \
              --env DATABASE_URL="$DATABASE_URL" \
              --env PGPASSWORD=recovery_test \
              postgres:18.6 dropdb --maintenance-db="$DATABASE_URL" \
              --if-exists recovery_restore_verify >/dev/null 2>&1 || true
            docker run --rm --network host \
              --env DATABASE_URL="$DATABASE_URL" \
              --env PGPASSWORD=recovery_test \
              postgres:18.6 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "DELETE FROM public.users WHERE \"openId\" IN ('ci-backup-restore-probe', 'ci-backup-sequence-probe')" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --rm -i --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env RESTORE_DATABASE_URL="$RESTORE_DATABASE_URL" \
            --env PGPASSWORD=recovery_test \
            postgres:18.6 sh -s <<'BACKUP_TEST'
          set -eu
          source_id="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At \
            -c "INSERT INTO public.users (\"openId\", name, role) VALUES ('ci-backup-restore-probe', 'CI backup restore probe', 'worker') RETURNING id")"
          pg_dump --format=custom --no-owner --no-acl \
            --dbname="$DATABASE_URL" --file=/tmp/va-dashboard-ci.dump
          test -s /tmp/va-dashboard-ci.dump
          createdb --maintenance-db="$DATABASE_URL" recovery_restore_verify
          pg_restore --exit-on-error --no-owner --no-acl \
            --dbname="$RESTORE_DATABASE_URL" /tmp/va-dashboard-ci.dump
          restored_id="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -At \
            -c "SELECT id FROM public.users WHERE \"openId\" = 'ci-backup-restore-probe'")"
          test "$restored_id" = "$source_id"
          next_id="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -At \
            -c "INSERT INTO public.users (\"openId\", name, role) VALUES ('ci-backup-sequence-probe', 'CI backup sequence probe', 'worker') RETURNING id")"
          test "$next_id" -gt "$source_id"
          BACKUP_TEST
          DATABASE_URL="$RESTORE_DATABASE_URL" pnpm db:verify-parity
      - name: Build the production container
        run: docker build --tag va-dashboard:ci .
      - name: Smoke-test the production image runtime
        run: |
          docker run --rm --entrypoint node va-dashboard:ci --input-type=module -e '
            import assert from "node:assert/strict";
            import { existsSync } from "node:fs";
            assert.equal(process.env.NODE_ENV, "production");
            assert.equal(process.env.LOCAL_AUTH_BYPASS, "false");
            assert.notEqual(process.getuid(), 0);
            assert.equal(existsSync("/usr/local/bin/pnpm"), false);
            assert.ok(existsSync("/app/dist/index.js"));
            for (const dependency of ["express", "pg", "drizzle-orm"]) {
              import.meta.resolve(dependency);
            }
          '
      - name: Validate Hetzner deployment script syntax
        run: bash -n deployment/hetzner/deploy.sh
      - name: Verify migration metadata matches the schema
        shell: bash
        run: |
          pnpm exec drizzle-kit generate --name ci-drift
          test -z "$(git status --porcelain -- drizzle-postgres-v1)"
