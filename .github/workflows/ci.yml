name: Recovery quality gates

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - "recovery/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: recovery_test
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U recovery -d recovery_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: "true"
      APTLSS_TEST_DATABASE_URL: postgresql://recovery:recovery_test@127.0.0.1:5432/recovery_test?sslmode=disable
      OWNER_PROVISIONING_TEST_DATABASE_URL: postgresql://recovery:recovery_test@127.0.0.1:5432/recovery_test?sslmode=disable
      APTLSS_TEST_DISABLE_BACKGROUND_JOBS: "true"
      NOTIFICATIONS_ENABLED: "false"
      DATABASE_URL: postgresql://recovery:recovery_test@127.0.0.1:5432/recovery_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit locked dependencies
        run: pnpm audit --audit-level=low
      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            if [[ "$name" == ".env" || ( "$name" == .env.* && "$name" != ".env.example" ) ]]; then
              echo "Refusing to keep environment file in Git: $file" >&2
              exit 1
            fi
          done < <(git ls-files -z)
      - name: Scan the release tree for secrets
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --no-banner --redact --report-format json --report-path /repo/gitleaks-report.json
          status=$?
          if test -s gitleaks-report.json; then
            jq -r '.[] | "gitleaks: \(.RuleID) \(.File):\(.StartLine)"' gitleaks-report.json
          fi
          rm -f gitleaks-report.json
          exit "$status"
      - run: pnpm check
      - run: pnpm check:db-transfer
      - name: Test deployment release-source validation
        run: node --test deployment/hetzner/release-source.test.mjs
      - name: Validate production URL and webhook Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          export PUBLIC_URL=https://dashboard.example.com
          export APP_URL=https://dashboard.example.com
          export VITE_FRONTEND_URL=https://dashboard.example.com
          export TRELLO_WEBHOOK_CALLBACK_URL=https://dashboard.example.com/api/trello-webhook
          docker compose --env-file .env config --format json | node --input-type=module -e '
            import assert from "node:assert/strict";
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const app = JSON.parse(input).services.app;
            assert.equal(app.environment.PUBLIC_URL, "https://dashboard.example.com");
            assert.equal(app.environment.TRELLO_WEBHOOK_CALLBACK_URL, "https://dashboard.example.com/api/trello-webhook");
            assert.equal(app.environment.APP_URL, "https://dashboard.example.com");
            assert.equal(app.environment.VITE_FRONTEND_URL, "https://dashboard.example.com");
          '
      - name: Require isolated native PostgreSQL fixture
        run: node scripts/verify-native-test-fixture.mjs
      - name: Apply PostgreSQL migrations
        run: pnpm exec drizzle-kit migrate
      - name: Verify PostgreSQL schema parity
        run: pnpm db:verify-parity
      - name: Build the production container
        run: docker build --tag va-dashboard:ci .
      - name: Scan the exact production image
        id: image_scan
        shell: bash
        run: bash scripts/scan-production-image.sh va-dashboard:ci "$GITHUB_WORKSPACE/artifacts/image-security/image-security-ci.json"
      - name: Smoke-test the production image runtime
        run: |
          docker run --rm --entrypoint node va-dashboard:ci --input-type=module -e '
            import assert from "node:assert/strict";
            import { existsSync } from "node:fs";
            assert.equal(process.env.NODE_ENV, "production");
            assert.equal(process.env.LOCAL_AUTH_BYPASS, "false");
            assert.notEqual(process.getuid(), 0);
            assert.equal(existsSync("/usr/local/bin/pnpm"), false);
            assert.ok(existsSync("/app/dist/index.js"));
            for (const dependency of ["express", "pg", "drizzle-orm"]) {
              import.meta.resolve(dependency);
            }
          '
      - name: Verify production image integrity and fail-closed startup
        run: node scripts/verify-production-image.mjs va-dashboard:ci
      - name: Verify configured PostgreSQL production image
        id: postgres_acceptance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-postgres-production-image.mjs va-dashboard:ci > artifacts/image-security/postgres-image-ci.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const receipt = JSON.parse(readFileSync("artifacts/image-security/postgres-image-ci.json", "utf8"));
            const scan = JSON.parse(readFileSync("artifacts/image-security/image-security-ci.json", "utf8"));
            assert.equal(receipt.passed, true);
            assert.equal(receipt.cleanupConfirmed, true);
            assert.equal(receipt.imageId, scan.imageId);
          '
      - name: Retain image security evidence
        if: ${{ always() && steps.image_scan.outcome != 'skipped' && steps.image_scan.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/image-security/image-security-ci.json
            artifacts/image-security/image-security-ci.json.trivy.json
            artifacts/image-security/image-security-ci.json.database.json
            artifacts/image-security/postgres-image-ci.json
          retention-days: 7
          if-no-files-found: warn
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for browser smoke tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify exact timer identity browser contracts
        run: node --test client/src/components/timer.identity.test.mjs
      - name: Verify generation-history retry browser contracts
        run: node --test e2e/aptlss-history-retry.test.mjs
      - name: Verify scheduled generation approval browser contracts
        run: node --test e2e/aptlss-scheduled-generation.test.mjs
      - name: Verify administrator async-operation browser contracts
        env:
          APTLSS_UI_ONLY: "true"
        run: pnpm exec playwright test --config e2e/home-atis-ui.config.ts
      - name: Verify administrator digest recovery browser contracts
        env:
          APTLSS_UI_ONLY: "true"
        run: pnpm exec playwright test --config e2e/digest-recovery-ui.config.ts
      - name: Verify isolated financial editor browser contracts
        run: pnpm exec playwright test --config e2e/financial-ui.config.ts
      - name: Verify confirmed card-analysis browser contracts
        run: pnpm exec playwright test --config e2e/atis-analysis-ui.config.ts
      - name: Verify authentication and worker dashboard in a browser
        env:
          JWT_SECRET: ci-only-playwright-session-secret-not-for-deployment
        run: pnpm exec playwright test --project=chromium
      - name: Verify guarded manager database and live browser contracts
        run: pnpm exec tsx scripts/verify-aptlss-safety.ts
      - name: Verify PostgreSQL backup and isolated restore
        shell: bash
        env:
          RESTORE_DATABASE_URL: postgresql://recovery:recovery_test@127.0.0.1:5432/recovery_restore_verify?sslmode=disable
        run: |
          set -euo pipefail
          cleanup() {
            docker run --rm --network host \
              --env DATABASE_URL="$DATABASE_URL" \
              --env PGPASSWORD=recovery_test \
              postgres:18.6 dropdb --maintenance-db="$DATABASE_URL" \
              --if-exists recovery_restore_verify >/dev/null 2>&1 || true
            docker run --rm --network host \
              --env DATABASE_URL="$DATABASE_URL" \
              --env PGPASSWORD=recovery_test \
              postgres:18.6 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "DELETE FROM public.users WHERE \"openId\" IN ('ci-backup-restore-probe', 'ci-backup-sequence-probe')" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --rm -i --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env RESTORE_DATABASE_URL="$RESTORE_DATABASE_URL" \
            --env PGPASSWORD=recovery_test \
            postgres:18.6 sh -s <<'BACKUP_TEST'
          set -eu
          source_id="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qAt \
            -c "INSERT INTO public.users (\"openId\", name, role) VALUES ('ci-backup-restore-probe', 'CI backup restore probe', 'worker') RETURNING id")"
          pg_dump --format=custom --no-owner --no-acl \
            --dbname="$DATABASE_URL" --file=/tmp/va-dashboard-ci.dump
          test -s /tmp/va-dashboard-ci.dump
          createdb --maintenance-db="$DATABASE_URL" recovery_restore_verify
          pg_restore --exit-on-error --no-owner --no-acl \
            --dbname="$RESTORE_DATABASE_URL" /tmp/va-dashboard-ci.dump
          restored_id="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -At \
            -c "SELECT id FROM public.users WHERE \"openId\" = 'ci-backup-restore-probe'")"
          if [ "$restored_id" != "$source_id" ]; then
            printf 'Restored worker ID mismatch: expected %s, got %s\n' "$source_id" "$restored_id" >&2
            exit 1
          fi
          next_id="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -qAt \
            -c "INSERT INTO public.users (\"openId\", name, role) VALUES ('ci-backup-sequence-probe', 'CI backup sequence probe', 'worker') RETURNING id")"
          case "$next_id" in
            ''|*[!0-9]*)
              printf 'Restored identity sequence returned a non-numeric ID: %s\n' "$next_id" >&2
              exit 1
              ;;
          esac
          if [ "$next_id" -le "$source_id" ]; then
            printf 'Restored identity sequence did not advance: source ID %s, next ID %s\n' "$source_id" "$next_id" >&2
            exit 1
          fi
          BACKUP_TEST
          DATABASE_URL="$RESTORE_DATABASE_URL" pnpm db:verify-parity
      - name: Validate Hetzner deployment script syntax
        run: bash -n deployment/hetzner/deploy.sh
      - name: Verify migration metadata matches the schema
        shell: bash
        run: |
          pnpm exec drizzle-kit generate --name ci-drift
          test -z "$(git status --porcelain -- drizzle-postgres-v1)"
