name: Prepare stable dependency lock metadata

on:
  pull_request:
    paths:
      - dependency-refresh.json
      - .github/workflows/refresh-stable-lock.yml

permissions:
  contents: read

jobs:
  public-lock-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Prepare isolated public package metadata
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const source = process.env.GITHUB_WORKSPACE;
          const output = path.join(process.env.RUNNER_TEMP, 'va-stable-lock-output');
          fs.mkdirSync(output);
          const hashes = {};
          for (const name of ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/wouter@3.13.0.patch']) {
            hashes[name] = crypto.createHash('sha256').update(fs.readFileSync(path.join(source, name))).digest('hex');
            fs.mkdirSync(path.dirname(path.join(output, name)), {recursive: true});
            fs.copyFileSync(path.join(source, name), path.join(output, name));
          }
          const manifest = JSON.parse(fs.readFileSync(path.join(output, 'package.json'), 'utf8'));
          const spec = JSON.parse(fs.readFileSync(path.join(source, 'dependency-refresh.json'), 'utf8'));
          const allowed = ['dependencies/react-hook-form', 'dependencies/react-resizable-panels',
            'devDependencies/@babel/parser', 'devDependencies/@babel/types'].sort();
          const requested = spec.updates.map(item => item.group + '/' + item.name).sort();
          if (JSON.stringify(requested) !== JSON.stringify(allowed)) throw new Error('Unexpected public update scope');
          for (const item of spec.updates) {
            if (manifest[item.group][item.name] !== item.from) throw new Error('Source declaration changed');
            manifest[item.group][item.name] = item.to;
          }
          fs.writeFileSync(path.join(output, 'package.json'), JSON.stringify(manifest, null, 2) + '\n');
          const receipt = {source_revision: process.env.GITHUB_SHA, source_metadata_sha256: hashes,
            updates: spec.updates, application_tree_or_credentials_copied: false,
            public_vendor_patch_inputs_copied: ['patches/wouter@3.13.0.patch'],
            package_lifecycle_scripts_enabled: false, application_tests_executed: false,
            source_runtime_or_deployment_qualified: false};
          fs.writeFileSync(path.join(output, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          JS
      - name: Resolve lock metadata with package lifecycle scripts disabled
        shell: bash
        run: |
          cd "$RUNNER_TEMP/va-stable-lock-output"
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Record exact output identities
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const output = path.join(process.env.RUNNER_TEMP, 'va-stable-lock-output');
          const receipt = JSON.parse(fs.readFileSync(path.join(output, 'receipt.json'), 'utf8'));
          receipt.generated_metadata_sha256 = {};
          for (const name of ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/wouter@3.13.0.patch']) {
            receipt.generated_metadata_sha256[name] = crypto.createHash('sha256')
              .update(fs.readFileSync(path.join(output, name))).digest('hex');
          }
          fs.writeFileSync(path.join(output, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          JS
      - name: Retain public metadata for independent review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-dependency-lock-metadata
          path: |
            ${{ runner.temp }}/va-stable-lock-output/package.json
            ${{ runner.temp }}/va-stable-lock-output/pnpm-lock.yaml
            ${{ runner.temp }}/va-stable-lock-output/pnpm-workspace.yaml
            ${{ runner.temp }}/va-stable-lock-output/patches/wouter@3.13.0.patch
            ${{ runner.temp }}/va-stable-lock-output/receipt.json
          if-no-files-found: error
