name: Prepare stable dependency lock metadata

on:
  pull_request:
    paths:
      - dependency-refresh.json
      - .github/workflows/refresh-stable-lock.yml

permissions:
  contents: read

jobs:
  public-lock-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Prepare isolated public package metadata
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python -I - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil
          source = Path(os.environ['GITHUB_WORKSPACE'])
          output = Path(os.environ['RUNNER_TEMP'])/'va-stable-lock-output'
          output.mkdir()
          names = ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']
          hashes = {}
          for name in names:
              raw = (source/name).read_bytes()
              hashes[name] = hashlib.sha256(raw).hexdigest()
              shutil.copyfile(source/name, output/name)
          package = json.loads((output/'package.json').read_text())
          spec = json.loads((source/'dependency-refresh.json').read_text())
          allowed = {('dependencies','react-hook-form'), ('dependencies','react-resizable-panels'),
                     ('devDependencies','@babel/parser'), ('devDependencies','@babel/types')}
          if {(x['group'],x['name']) for x in spec['updates']} != allowed or len(spec['updates']) != 4:
              raise ValueError('Unexpected public dependency update scope')
          for item in spec['updates']:
              if package[item['group']][item['name']] != item['from']:
                  raise ValueError('Expected source declaration changed')
              package[item['group']][item['name']] = item['to']
          (output/'package.json').write_text(json.dumps(package,indent=2)+'\n')
          receipt = {'source_revision':os.environ['GITHUB_SHA'], 'source_metadata_sha256':hashes,
                     'updates':spec['updates'], 'application_source_or_credentials_copied':False,
                     'package_lifecycle_scripts_enabled':False, 'application_tests_executed':False,
                     'source_runtime_or_deployment_qualified':False}
          (output/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Resolve lock metadata with package lifecycle scripts disabled
        shell: bash
        run: |
          cd "$RUNNER_TEMP/va-stable-lock-output"
          pnpm install --lockfile-only --ignore-scripts
      - name: Record exact output identities
        shell: bash
        run: |
          python -I - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          output = Path(os.environ['RUNNER_TEMP'])/'va-stable-lock-output'
          receipt = json.loads((output/'receipt.json').read_text())
          receipt['generated_metadata_sha256'] = {
              name:hashlib.sha256((output/name).read_bytes()).hexdigest()
              for name in ['package.json','pnpm-lock.yaml','pnpm-workspace.yaml']}
          (output/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Retain public metadata for independent review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-dependency-lock-metadata
          path: |
            ${{ runner.temp }}/va-stable-lock-output/package.json
            ${{ runner.temp }}/va-stable-lock-output/pnpm-lock.yaml
            ${{ runner.temp }}/va-stable-lock-output/pnpm-workspace.yaml
            ${{ runner.temp }}/va-stable-lock-output/receipt.json
          if-no-files-found: error
