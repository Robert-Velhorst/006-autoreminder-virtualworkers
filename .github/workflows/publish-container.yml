name: Publish release container

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: recovery_test
          POSTGRES_USER: release
          POSTGRES_PASSWORD: release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U release -d recovery_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: "true"
      DATABASE_URL: postgresql://release:release_test@127.0.0.1:5432/recovery_test?sslmode=disable
      APTLSS_TEST_DATABASE_URL: postgresql://release:release_test@127.0.0.1:5432/recovery_test?sslmode=disable
      OWNER_PROVISIONING_TEST_DATABASE_URL: postgresql://release:release_test@127.0.0.1:5432/recovery_test?sslmode=disable
      APTLSS_TEST_DISABLE_BACKGROUND_JOBS: "true"
      NOTIFICATIONS_ENABLED: "false"
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.12.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit locked dependencies
        run: pnpm audit --audit-level=low

      - name: Check types
        run: pnpm check

      - name: Check database transfer tooling
        run: pnpm check:db-transfer

      - name: Require isolated native PostgreSQL fixture
        run: node scripts/verify-native-test-fixture.mjs

      - name: Apply database migrations
        run: pnpm exec drizzle-kit migrate

      - name: Verify database schema parity
        run: pnpm db:verify-parity

      - name: Run test suite
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Scan release tree for secrets
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --no-banner --redact --report-format json --report-path /repo/gitleaks-report.json
          status=$?
          if test -s gitleaks-report.json; then
            jq -r '.[] | "gitleaks: \(.RuleID) \(.File):\(.StartLine)"' gitleaks-report.json
          fi
          rm -f gitleaks-report.json
          exit "$status"

      - name: Verify Docker image builds
        run: docker build --tag va-dashboard:release-check .

      - name: Verify configured PostgreSQL production image
        run: node scripts/verify-postgres-production-image.mjs va-dashboard:release-check

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
