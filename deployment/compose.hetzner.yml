name: va-dashboard

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    image: ${MIGRATION_IMAGE:?MIGRATION_IMAGE must match the app release and end in -migrate}
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must use the mysql service hostname}
    depends_on:
      mysql:
        condition: service_healthy
    command: ["pnpm", "exec", "drizzle-kit", "migrate"]
    networks:
      - app-network

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable release tag or digest}
    restart: unless-stopped
    env_file:
      - path: ${APP_ENV_FILE:-.env.app}
        required: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOCAL_AUTH_BYPASS: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:?WEBHOOK_BASE_URL is required}
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3025}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-va-dashboard-hetzner-mysql}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-va-dashboard-hetzner-redis}
