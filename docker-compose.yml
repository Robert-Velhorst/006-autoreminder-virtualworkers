services:
  app:
    image: ${APP_IMAGE:-ghcr.io/robert-velhorst/006-autoreminder-virtualworkers:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3025}:3000"
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOCAL_AUTH_BYPASS: "false"
      SESSION_APP_ID: ${SESSION_APP_ID:-va-dashboard}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRELLO_WEBHOOK_CALLBACK_URL: ${TRELLO_WEBHOOK_CALLBACK_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
