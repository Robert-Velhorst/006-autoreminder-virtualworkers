services:
  # MySQL Database
  mysql:
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - va-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional but recommended)
  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - va-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]

  # Apply the canonical Drizzle migration lineage before the app starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
    command: ["pnpm", "exec", "drizzle-kit", "migrate"]
    networks:
      - va-network

  # VA Dashboard Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3025}:3000"
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOCAL_AUTH_BYPASS: "false"
      SESSION_APP_ID: ${SESSION_APP_ID:-va-dashboard}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PUBLIC_URL: ${PUBLIC_URL:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      TRELLO_WEBHOOK_CALLBACK_URL: ${TRELLO_WEBHOOK_CALLBACK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - va-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional public ingress. The public profile is started by
  # scripts/start-public-dashboard.ps1 after the application is healthy.
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["public"]
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_URL: ${NGROK_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -n "$$NGROK_URL" ]; then
          exec ngrok http app:3000 --url "$$NGROK_URL" --config /etc/ngrok.yml --log stdout --name joyce-dashboard;
        else
          exec ngrok http app:3000 --config /etc/ngrok.yml --log stdout --name joyce-dashboard;
        fi
    volumes:
      - ./deployment/ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - "127.0.0.1:${NGROK_INSPECT_PORT:-4041}:4040"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - va-network

networks:
  va-network:
    driver: bridge

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-joyce-work-schedule_joyce_mysql_data}
    driver: local
  redis_data:
    driver: local
